<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Edit invitation</title><link rel="stylesheet" href="{{ url_for('static', filename='css/site.css') }}"></head>
<body class="admin-shell"><header class="admin-header"><div><a class="back-link" href="{{ url_for('admin.dashboard') }}">← Dashboard</a><h1>Edit invitation</h1></div></header><main class="admin-main"><form method="post" class="editor-form"><section class="editor-section"><p class="eyebrow">Opening scene</p><h2>Set the feeling</h2><div class="form-grid"><label>Celebrant name<input name="celebrant" value="{{ content.celebrant }}" required></label><label>Invitation title<input name="title" value="{{ content.title }}" required></label><label class="wide">Intro message<textarea name="intro" rows="3">{{ content.intro }}</textarea></label></div></section><section class="editor-section"><p class="eyebrow">The details</p><h2>Where the story unfolds</h2><div class="form-grid"><label>Date<input name="date" value="{{ content.date }}"></label><label>Time<input name="time" value="{{ content.time }}"></label><label>Venue<input name="venue" value="{{ content.venue }}"></label><label>Address<input name="address" value="{{ content.address }}"></label><label>Dress code<input name="dress_code" value="{{ content.dress_code }}"></label><label>RSVP deadline<input name="rsvp_deadline" value="{{ content.rsvp_deadline }}"></label><label class="wide">Story / welcome<textarea name="story" rows="4">{{ content.story }}</textarea></label><label class="wide">Gifts guidance<textarea name="gifts" rows="3">{{ content.gifts }}</textarea></label><label class="wide">Contact information<textarea name="contact" rows="3">{{ content.contact }}</textarea></label></div></section><section class="editor-section"><p class="eyebrow">Guest book</p><h2>Choose what guests share</h2><div class="toggle-list"><label><input type="checkbox" name="show_party_size" {% if content.show_party_size %}checked{% endif %}> Party size</label><label><input type="checkbox" name="show_contact" {% if content.show_contact %}checked{% endif %}> Contact details</label><label><input type="checkbox" name="show_notes" {% if content.show_notes %}checked{% endif %}> Notes and dietary wishes</label></div></section><div class="editor-actions"><button class="quiet-button" type="submit" name="action" value="save">Save draft</button><button class="button" type="submit" name="action" value="publish">Save & publish <span>→</span></button></div></form></main></body></html>
