<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Admin sign in</title><link rel="stylesheet" href="{{ url_for('static', filename='css/site.css') }}"></head>
<body class="admin-shell"><div class="login-panel"><p class="eyebrow">Private garden gate</p><h1>Welcome back.</h1><p>Sign in to tend the invitation.</p>{% with messages = get_flashed_messages(with_categories=true) %}{% for category, message in messages %}<p class="flash {{ category }}">{{ message }}</p>{% endfor %}{% endwith %}<form method="post" class="admin-form"><label>Username<input name="username" required autofocus></label><label>Password<input type="password" name="password" required></label><button class="button" type="submit">Enter the garden <span>→</span></button></form><a class="back-link" href="{{ url_for('public.home') }}">← Return to invitation</a></div></body></html>
